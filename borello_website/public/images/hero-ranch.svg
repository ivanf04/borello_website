<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2013"/>
      <stop offset="0.45" stop-color="#6b4a26"/>
      <stop offset="0.75" stop-color="#c98e46"/>
      <stop offset="1" stop-color="#e8b96a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f6c97e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6c97e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a33"/>
      <stop offset="1" stop-color="#5c4226"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59401f"/>
      <stop offset="1" stop-color="#40301a"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c16"/>
      <stop offset="1" stop-color="#241b0e"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2010"/>
      <stop offset="1" stop-color="#17110a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1040" cy="560" r="330" fill="url(#sunGlow)"/>
  <circle cx="1040" cy="560" r="62" fill="#ffe2a4"/>

  <!-- distant ridge -->
  <path d="M0 560 Q 200 500 420 545 T 820 540 Q 1050 505 1250 550 T 1600 535 V 900 H 0 Z" fill="url(#ridgeFar)" opacity="0.85"/>

  <!-- mid hills -->
  <path d="M0 640 Q 260 570 520 625 T 1020 630 Q 1280 585 1600 645 V 900 H 0 Z" fill="url(#ridgeMid)"/>

  <!-- oak silhouettes on mid hill -->
  <g fill="#2c2011">
    <path d="M1180 596 q4 -26 22 -34 q-8 -4 -4 -12 q14 -16 34 -10 q22 6 20 24 q14 8 8 22 q-6 12 -22 12 l-24 0 q-4 10 -4 22 l-10 0 q2 -12 -2 -22 z"/>
    <path d="M330 604 q3 -20 17 -27 q-6 -3 -3 -9 q11 -13 27 -8 q17 5 16 19 q11 6 6 17 q-5 10 -17 10 l-19 0 q-3 8 -3 17 l-8 0 q2 -9 -2 -17 z"/>
  </g>

  <!-- near hill with vineyard rows -->
  <path d="M0 720 Q 320 650 640 705 T 1600 715 V 900 H 0 Z" fill="url(#hillNear)"/>
  <g stroke="#4a3a1c" stroke-width="3" fill="none" opacity="0.5">
    <path d="M60 760 Q 480 700 900 748 T 1600 758"/>
    <path d="M20 790 Q 460 728 920 780 T 1600 792"/>
    <path d="M0 822 Q 440 758 940 814 T 1600 828"/>
    <path d="M0 856 Q 420 790 960 850 T 1600 866"/>
  </g>

  <!-- foreground slope -->
  <path d="M0 830 Q 400 780 820 838 T 1600 842 V 900 H 0 Z" fill="url(#hillFront)"/>
</svg>
